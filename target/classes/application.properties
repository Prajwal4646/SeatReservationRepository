spring.application.name=seat-reservation-app
server.port=${PORT:8080}
spring.jackson.default-property-inclusion=non_null
server.error.include-message=always

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

app.database-url=${DATABASE_URL:postgresql://postgres@127.0.0.1:5432/seats}
app.db-pool-max=${DB_POOL_MAX:20}
app.jwt-secret=${JWT_SECRET:dev-secret-change-me}
app.admin-token=${ADMIN_TOKEN:admin-dev-token}
app.enable-token-mint=${ENABLE_TOKEN_MINT:true}
